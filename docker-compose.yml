services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - douyin-api
      - kuaishou-api
    environment:
      - DOUYIN_API_URL=http://douyin-api:8080
      - KUAISHOU_API_URL=http://kuaishou-api:5557
      - KUAISHOU_COOKIE=${KUAISHOU_COOKIE:-}
      - KUAISHOU_PROXY=${KUAISHOU_PROXY:-}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - unmark-network

  douyin-api:
    image: evil0ctal/douyin_tiktok_download_api:latest
    ports:
      - "8080:80"  # 容器内部端口 80，映射到主机 8080
    volumes:
      - ./config.yaml:/app/crawlers/douyin/web/config.yaml:ro  # 挂载配置文件
    restart: unless-stopped
    networks:
      - unmark-network

  kuaishou-api:
    image: joeanamier/ks-downloader:latest
    command: ["python", "main.py", "api", "--host", "0.0.0.0", "--port", "5557"]
    ports:
      - "5557:5557"
    volumes:
      - ks_downloader_volume:/app/Volume
    restart: unless-stopped
    networks:
      - unmark-network

networks:
  unmark-network:
    driver: bridge

volumes:
  ks_downloader_volume:
